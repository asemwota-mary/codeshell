<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codeshell</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <!-- Left hand side -->
    <div class="left-container">
        <!-- first  box -->
        <header>
            <h3>Cod<span>sh</span>ell. </h3>
            <nav>
                <ul>
                    <li>
                        <a>How it works</a>
                    </li>
                    <li>
                        <a>Mission</a>
                    </li>
                    <li>
                        <a>Faq</a>
                    </li>
                    <li>
                        <i class="bx bx-search"></i>
                    </li>
                </ul>
            </nav>
            <i class="bx bx-menu"> </i>
        </header>
        <!-- second box -->
        <div class="second-box">
            <div class="play-codshell">
                <img src="./images/playbtn.png" alt="play button">
                <h5>Introducing Codshell</h5>
            </div>
            <h2>Work the way you want</h2>
            <p>A new professional network for yourm independent journey</p>
            <div class="input-box">
                <input type="email" placeholder="iwant@findajob.com"/>
                <button> Get Started </button>
            </div>
        </div>
        <!-- third box -->
        <div>
            <div class="circle">
                <i class="bx bx-arrow-down-stroke"></i>
            </div>
        </div>
    </div>
    <!-- Right hand side -->
    <div class="right-container">
        <img src="./images/codeshellimg.png" alt="codeshell 3D cartoon"/>
    </div>
</body>
</html>
